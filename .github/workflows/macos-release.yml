# Builds Bloodborne.app (scripts/macos/package_app.sh) on Apple Silicon. A pushed mac-v* tag
# attaches the zip to that tag's GitHub release (created as a pre-release if missing); a manual
# run keeps it as a workflow artifact.
name: macOS app

on:
  push:
    tags: ['mac-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Tools and Rosetta 2
        run: |
          brew install cmake ninja nasm glslang pkgconf boost
          arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license

      - name: Dependency cache
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ hashFiles('scripts/macos/bootstrap_deps.sh') }}-py20260924

      - name: Dependencies (x86-64 and arm64)
        run: |
          bash scripts/macos/bootstrap_deps.sh
          BB_DEPS_ARCH=arm64 bash scripts/macos/bootstrap_deps.sh

      - name: Build
        run: bash build_macos.sh

      # Informational: the runner is a VM (its GPU and Rosetta differ from a real Mac).
      - name: Tests
        continue-on-error: true
        run: bash build_macos.sh --test

      - name: Package
        run: |
          version=${GITHUB_REF_NAME#mac-v}
          [[ $GITHUB_REF_TYPE == tag ]] || version=dev-$(git rev-parse --short HEAD)
          bash scripts/macos/package_app.sh "$version"
          zip=dist/Bloodborne-macOS-$version.zip
          [[ $version == *-beta* ]] && zip=dist/Bloodborne-OnlineBeta-macOS-$version.zip # (package_app.sh)
          echo "ZIP=$zip" >> "$GITHUB_ENV"
          bash tools/pkg_extract/build_release.sh dist/pkg_extract
          (cd dist && ditto -c -k pkg_extract pkg_extract-macOS.zip)

      - uses: actions/upload-artifact@v4
        with:
          name: Bloodborne-macOS
          path: |
            ${{ env.ZIP }}
            dist/pkg_extract-macOS.zip

      - name: Attach to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
              gh release create "$GITHUB_REF_NAME" --prerelease --title "$GITHUB_REF_NAME" --notes "See README.md."
          gh release upload "$GITHUB_REF_NAME" "$ZIP" dist/pkg_extract-macOS.zip --clobber
